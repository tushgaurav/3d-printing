  <meta name="color-scheme" content="dark">
  <title>Layer1</title>
  <script>
    // Theme before first paint: the screen's saved choice, else ?theme= / #theme= (app.js
    // then falls back to the config default). Keep in step with session.js.
    try {
      var t = localStorage.getItem('layer1.theme')
        || new URLSearchParams(location.search).get('theme')
        || new URLSearchParams(location.hash.slice(1)).get('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* storage blocked: app.js still applies the default */ }
    // Brightness too, so a dimmed screen doesn't flash full bright on reload (session.js).
    try {
      var b = +localStorage.getItem('layer1.brightness');
      if (b >= 30 && b < 100) {
        document.documentElement.dataset.dim = '';
        document.documentElement.style.setProperty('--dim', String(1 - b / 100));
      }
    } catch (e) { /* app.js applies it */ }
  </script>
