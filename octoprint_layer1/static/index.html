<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>Layer1</title>
  <script>
    // Theme before first paint: the screen's saved choice, else ?theme= / #theme= (app.js
    // then falls back to the config default). Keep in step with session.js.
    try {
      var t = localStorage.getItem('layer1.theme')
        || new URLSearchParams(location.search).get('theme')
        || new URLSearchParams(location.hash.slice(1)).get('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* storage blocked: app.js still applies the default */ }
    // Brightness too, so a dimmed screen doesn't flash full bright on reload (session.js).
    try {
      var b = +localStorage.getItem('layer1.brightness');
      if (b >= 30 && b < 100) {
        document.documentElement.dataset.dim = '';
        document.documentElement.style.setProperty('--dim', String(1 - b / 100));
      }
    } catch (e) { /* app.js applies it */ }
  </script>
  <link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="stage">
    <div id="app" class="booting">
      <nav id="rail"></nav>
      <header id="status"></header>
      <main id="screens"></main>
      <div id="layer"></div>
      <div id="boot">
        <div class="boot-mark">L1</div>
        <div class="boot-text">Starting…</div>
      </div>
    </div>
  </div>
</body>
</html>
