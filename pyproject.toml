[build-system]
# 77+ for the SPDX `license` string below (PEP 639). It needs Python 3.9 to build.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-Layer1"
version = "0.1.0"
description = "Full-screen touch UI for OctoPrint on a 480x320 Raspberry Pi screen"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Tushar Gaurav" }]
requires-python = ">=3.9,<4"
# OctoPrint itself is intentionally NOT listed: installing into OctoPrint's own
# virtualenv must never try to upgrade or reinstall OctoPrint.
dependencies = []
keywords = ["octoprint", "plugin", "touchscreen", "kiosk", "touch ui", "raspberry pi"]
classifiers = [
  "Framework :: OctoPrint",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://layer1.nodebench.com"
Source = "https://github.com/tushgaurav/layer1"
Issues = "https://github.com/tushgaurav/layer1/issues"
Author = "https://tushgaurav.com"

[project.entry-points."octoprint.plugin"]
layer1 = "octoprint_layer1"

[tool.setuptools.packages.find]
include = ["octoprint_layer1*"]

# static/ and its sub-folders are found as namespace packages; ship their files.
[tool.setuptools.package-data]
"*" = ["*.html", "*.json", "*.css", "*.js", "*.woff2", "*.txt"]
