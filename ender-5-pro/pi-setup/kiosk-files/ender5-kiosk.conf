# Ender 5 Pro touchscreen kiosk. Apply changes with:  sudo ender5-kiosk restart

# Page to show: the touch UI served by the OctoPrint plugin (through OctoPi's
# web proxy on port 80, which also serves the webcam at /webcam/).
URL="http://127.0.0.1/plugin/ender5touch/static/index.html"

# Framebuffer of the touchscreen. "auto" picks the first one that isn't the
# HDMI output (i.e. the SPI screen). Set e.g. /dev/fb1 if auto picks wrong.
FBDEV="auto"

# Touch calibration: X "Coordinate Transformation Matrix" (9 numbers).
# Easiest:     sudo ender5-kiosk calibrate        (follow the crosshairs)
# Quick fixes: sudo ender5-kiosk rotate-touch 90|180|270|swap|invert-x|invert-y
TOUCH_MATRIX=""

# Which input devices get that matrix (regex on the name `xinput list` shows).
TOUCH_DEVICE="ADS7846|[Tt]ouch"

# Optional OctoPrint API key. Leave empty to pair from the screen instead,
# which is better: the key then never sits in this file or in `ps` output.
API_KEY=""

# Extra Chromium flags. --disable-gpu skips GPU probing on a plain framebuffer.
CHROMIUM_FLAGS="--disable-gpu"

# Zoom. 1 for a 480x320 screen.
SCALE="1"
