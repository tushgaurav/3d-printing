<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>404 — Layer1</title>
  <style>
    @font-face { font-family: "Geist"; font-weight: 100 900; font-display: swap; src: url(fonts/Geist-Variable.woff2) format("woff2"); }
    @font-face { font-family: "Geist Mono"; font-weight: 100 900; font-display: swap; src: url(fonts/GeistMono-Variable.woff2) format("woff2"); }

    :root {
      --frame: #08090a;
      --canvas: #111215;
      --surface: #1b1c20;
      --surface-2: #25272b;
      --hair: rgba(255, 255, 255, 0.07);
      --text: #f4f4f1;
      --text-2: #a4a6ab;
      --text-3: #6d7076;
      --signal: #c8f251;
      --signal-dim: rgba(200, 242, 81, 0.13);
      --danger: #ff5f57;
      --danger-dim: rgba(255, 95, 87, 0.14);
      --r: 12px;
      --r-sm: 9px;
      --sans: "Geist", "Inter", "DejaVu Sans", system-ui, sans-serif;
      --mono: "Geist Mono", "DejaVu Sans Mono", ui-monospace, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--canvas);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--hair);
      border-radius: var(--r);
      padding: 40px 36px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .code {
      font-family: var(--mono);
      font-feature-settings: "ss09";
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -2px;
      color: var(--danger);
      line-height: 1;
      margin-bottom: 12px;
    }

    .title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .desc {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .path {
      display: inline-block;
      background: var(--surface-2);
      border-radius: var(--r-sm);
      padding: 6px 12px;
      font-family: var(--mono);
      font-feature-settings: "ss09";
      font-size: 13px;
      color: var(--text-3);
      word-break: break-all;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--signal);
      color: #10150a;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: var(--r-sm);
      padding: 10px 24px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn:hover { filter: brightness(1.1); }

    .btn svg { width: 16px; height: 16px; }

    .brand {
      margin-top: 32px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <div class="title">Page not found</div>
    <div class="desc">The path you requested doesn't exist on this server.</div>
    <div class="path" id="path"></div>
    <div>
      <a class="btn" href="/">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 6.5 8 2l6 4.5"/><path d="M3.5 7.5V13a.5.5 0 0 0 .5.5h3V10h2v3.5h3a.5.5 0 0 0 .5-.5V7.5"/>
        </svg>
        Back to Layer1
      </a>
    </div>
  </div>
  <div class="brand">Layer1</div>
  <script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
